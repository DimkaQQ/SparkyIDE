<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sparky IDE — an AI coding agent with any model, your files and GitHub." />
    <title>Sparky IDE</title>
    <script>
      try {
        var raw = localStorage.getItem('sparky-ide:state:v1');
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved && saved.theme === 'light') {
            document.documentElement.dataset.theme = 'light';
          }
        }
      } catch (error) {
        /* first run */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
